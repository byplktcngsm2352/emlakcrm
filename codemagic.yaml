workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned IPA Build (iOS 15+)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up project & dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build Flutter iOS App (Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned IPA Artifact
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r emlak_crm_unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv emlak_crm_unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
